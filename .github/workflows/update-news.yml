name: Update stock news

on:
  push:
    branches: [main]
    paths:
      - config/stocks.json
  schedule:
    # 08:00, 12:00, 16:00, 20:00 KST (GitHub cron uses UTC)
    - cron: "0 3,7,11,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stock-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and summarize RSS news
        run: npm run news:update

      - name: Commit updated data
        shell: bash
        run: |
          if git diff --quiet -- public/data; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore: update stock news"
          git push
